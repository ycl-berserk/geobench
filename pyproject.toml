[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geobench"
version = "0.1.0.dev0"
description = "Deterministic plane-geometry kernel with an MCP agent interface, for authoring competition-grade geometry problems."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "ycl-berserk" }]
keywords = ["geometry", "olympiad", "mcp", "agent", "cas", "education"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Education",
  "Topic :: Scientific/Engineering :: Mathematics",
]

# The kernel's only hard dependency is an exact-arithmetic CAS.
# See docs/decisions.md D1/D2 — the stack is still 'proposed'.
dependencies = ["sympy>=1.13"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "mcp>=2.0",
]

# The kernel never needs pixels; this is only for looking at the rendered
# figures. See scripts/preview.py.
preview = ["pymupdf>=1.24"]

# The desktop studio. PySide6-Essentials rather than the full PySide6:
# it carries QtWidgets, QtGui and QtSvg, and not the browser engine the
# studio has no use for.
app = ["PySide6-Essentials>=6.6"]

[project.scripts]
geobench-mcp = "geobench.server:main"
geobench-app = "geobench.app.main:main"

[project.urls]
Homepage = "https://github.com/ycl-berserk/geobench"
Issues = "https://github.com/ycl-berserk/geobench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/geobench"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "NPY", "ARG", "PTH"]
# E501: line length is handled by the formatter.
# RUF001: the project is Chinese-primary, so full-width punctuation in prose
#         and in user-facing strings is intentional.
ignore = ["E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["geobench"]

[[tool.mypy.overrides]]
module = ["sympy", "sympy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
  "oracle: cross-checked against an independent implementation",
  "property: property-based / randomised checks",
  "degeneracy: degenerate-configuration handling",
  "contract: public API matches docs/spec.md",
  "slow: long-running",
]
