name: release

# A Windows zip that a teacher can unzip and run.  Manual dispatch builds
# an artifact for testing; a v* tag also publishes it as a release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the studio and the packager
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[app,packaging]"

      - name: Draw the icon
        run: python scripts/make_icon.py

      - name: Build the one-folder application
        run: python -m PyInstaller --noconfirm packaging/geobench.spec

      - name: Add samples, the guide and the licence
        shell: pwsh
        run: |
          Copy-Item samples dist/geobench -Recurse -Force
          Copy-Item docs/teacher-guide.md "dist/geobench/使用说明.md" -Force
          Copy-Item LICENSE dist/geobench/LICENSE -Force

      - name: Smoke test the packaged executable
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & .\dist\geobench\geobench.exe --smoke-test
          if ($LASTEXITCODE -ne 0) {
            throw "the packaged application failed its smoke test (exit $LASTEXITCODE)"
          }

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path dist/geobench -DestinationPath dist/geobench-win64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: geobench-win64
          path: dist/geobench-win64.zip

      - name: Publish the release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/geobench-win64.zip
          generate_release_notes: true
