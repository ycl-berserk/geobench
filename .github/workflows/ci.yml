name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The app extra is here so that mypy can check the studio's modules:
      # without PySide6 installed they are all "Any", and checking them
      # would be checking nothing.
      - run: pip install -e ".[dev,app]"
      - name: mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: pytest
        run: pytest -q

  # The gate list in docs/ai-workflow.md section 5 maps one-to-one onto test
  # suites. A suite is added here when the task that owns it lands.
  #   unit        -> T001, T006, T007, T008
  #   no_float    -> T001
  #   oracle      -> T002, T006
  #   unit/dsl    -> T004
  #   property    -> T004
  #   contract    -> T003, T015
  #   integration -> T003
  #   perf        -> T016
  #   app         -> T019
  #   degeneracy  -> T006
  #   eval        -> T041
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Qt needs a handful of system libraries that the runner image does
      # not carry. Without them PySide6 cannot even be imported, and the
      # studio's tests would be a vacuous pass.
      - name: install Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libdbus-1-3 libxkbcommon0 \
            libfontconfig1 libfreetype6
      - run: pip install -e ".[dev,app]"
      - name: unit
        run: pytest tests/unit -q
      - name: unit/dsl
        run: pytest tests/unit/dsl -q
      - name: oracle
        run: pytest tests/oracle -q
      - name: property
        run: pytest tests/property -q
      - name: no-float
        run: pytest tests/no_float -q
      - name: contract
        run: pytest tests/contract -q
      - name: integration
        run: pytest tests/integration -q
      - name: perf
        run: pytest tests/perf -q
      - name: app
        run: pytest tests/app -q
      # The AI's own answers are gated here: the recorded figures are
      # replayed through the same harness the live run uses, so a kernel
      # change that breaks them is caught here rather than in front of
      # a teacher.  Never the network.
      - name: eval
        run: pytest tests/eval -q
      - name: the coverage table is up to date
        run: python scripts/gen_coverage.py --check
